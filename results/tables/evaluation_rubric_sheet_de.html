<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rating sheet</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --ink: #1b1b1a; --muted: #6a6a66;
    --line: #dddcd7; --accent: #1f5fa8; --warn: #b02828; --ok: #1f7a4d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0 16px 120px; background: var(--bg); color: var(--ink);
         font: 16px/1.6 -apple-system, "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--bg);
           border-bottom: 1px solid var(--line); padding: 14px 0 10px;
           margin: 0 -16px 20px; padding-left: 16px; padding-right: 16px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 10px; }
  .bar div { height: 100%; width: 0%; background: var(--ok); border-radius: 3px;
             transition: width .2s; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 18px 20px; margin-bottom: 18px; }
  .card.done { border-left: 4px solid var(--ok); }
  .num { font-weight: 700; color: var(--accent); }
  .q { font-weight: 600; margin: 2px 0 12px; }
  .facts { background: #fafaf8; border: 1px solid var(--line); border-radius: 8px;
           padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
  .facts div { display: flex; gap: 8px; }
  .facts b { min-width: 190px; color: var(--muted); font-weight: 500; }
  .flag { color: var(--warn); font-weight: 600; }
  .answer { white-space: pre-wrap; background: #fbfbf9; border: 1px solid var(--line);
            border-left: 3px solid var(--accent); border-radius: 6px;
            padding: 14px 16px; margin-bottom: 16px; }
  details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px;
            margin-bottom: 16px; background: #fafaf8; }
  summary { cursor: pointer; font-size: 14px; font-weight: 600; }
  .passage { border-top: 1px solid var(--line); padding: 10px 0; font-size: 14px; }
  .passage .mk { font-weight: 700; color: var(--accent); }
  .passage .src { color: var(--muted); }
  .passage p { margin: 6px 0 0; white-space: pre-wrap; }
  .pnote { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  .dim { margin-bottom: 12px; }
  .dim > b { display: block; margin-bottom: 6px; font-size: 15px; }
  label { display: block; cursor: pointer; padding: 5px 10px; border-radius: 6px;
          font-size: 14px; }
  label:hover { background: #f0f0ec; }
  input[type=radio] { margin-right: 8px; }
  textarea { width: 100%; border: 1px solid var(--line); border-radius: 6px;
             padding: 8px; font: inherit; font-size: 14px; resize: vertical; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
           border-top: 1px solid var(--line); padding: 12px 16px; }
  .frow { max-width: 860px; margin: 0 auto; display: flex; gap: 12px;
          align-items: center; flex-wrap: wrap; }
  button { font: inherit; padding: 9px 16px; border-radius: 7px; cursor: pointer;
           border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  button.ghost { background: #fff; color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input[type=text] { font: inherit; padding: 8px 10px; border: 1px solid var(--line);
                     border-radius: 6px; }
  @media (max-width: 640px) { .facts b { min-width: 0; display: block; } .facts div { display: block; } }
</style>
</head>
<body>
<header><div class="wrap">

</div></header>

<div class="wrap" id="cards"></div>

<footer><div class="frow">

    <input type="text" id="rater"></label>
  <button id="save" disabled></button>
  <button class="ghost" id="clear"></button>
  <span class="sub" id="hint"></span>
</div></footer>

<script>
const DATA = {"rows": [{"order": 1, "question_id": "Q07", "question": "Is the amount you gave me an offer I can rely on, or could the real maximum be different?", "applicant": "P1", "category": "uncertainty", "facts": [["Geschaetztes Maximum", "28.429 (an der Obergrenze)"], ["Fall markiert", "nein"]], "answer": "The amount I provided, $28,429, is an estimate based on past decisions in the data and is not a guarantee. According to the contract, this is the highest loan amount for which the probability of approval is at least 0.8, as determined by the model from dataset_1 [2]. \n\nThe contract also notes that this amount is an upper limit, meaning that the real maximum could potentially be higher but the data does not show it [2]. Therefore, while $28,429 is the highest amount with a 0.8 or higher approval probability based on the data, the actual maximum loan amount could be greater in real-world scenarios. [2]", "passages": [{"marker": 1, "source": "feature_glossary", "score": 0.4794, "text": "Values the system calculates\n\n- **Loan-to-income:** the loan amount divided by the annual income. 0.3 means the loan\n  equals 30 % of one year's income. Higher values make approval less likely.\n- **P(approve):** the model's calibrated probability that a loan of this amount would be\n  approved for this applicant. 0.8 means: among applicants given 0.8, about 80 % were approved.\n- **Estimated maximum amount:** the highest loan amount for which P(approve) is still at\n  least 0.8. It is an estimate based on past decisions in the data, not a promise.\n- **Upper limit flag:** when the estimated maximum equals the highest amount the system was\n  allowed to check, the real maximum may be higher; the data does not show it.\n- **No amount found:** even the smallest amount checked does not reach P(approve) 0.8."}, {"marker": 2, "source": "model_card", "score": 0.409, "text": "Model details\n\n- **Final models:** model A (dataset 1) and model B (dataset 2), each a Random Forest classifier.\n- **Monotonic constraint:** loan_amount and loan_to_income may only lower the approval probability, so the maximum-amount sweep is valid (checked in step 20).\n- **Calibration:** a correction learned on the validation part, so probabilities can be taken literally (step 19).\n- **Output:** P(approve) at the requested amount, and the highest amount with P(approve) >= 0.8 (also 0.7 and 0.9).\n- **Inputs:** age, dependents, annual income, credit score, loan amount, loan term, loan-to-income, marital status, education, employment status, loan purpose."}, {"marker": 3, "source": "datasheet", "score": 0.3766, "text": "Limitations\n\nTODO (currency unknown, different credit score ranges, no true maximum amount,\nsmall 61+ group in dataset 2)"}, {"marker": 4, "source": "model_card", "score": 0.3451, "text": "Maximum-amount sweep on the test part\n\n| dataset | threshold | share_with_no_amount | share_of_maximums_at_upper_limit | median_max_amount | median_requested_amount | consistency |\n| --- | --- | --- | --- | --- | --- | --- |\n| dataset_1 | 0.7 | 0.2942 | nan | 39766.0 | 21071.0 | 0.844 |\n| dataset_1 | 0.8 | 0.2944 | 0.0336 | 31950.0 | 21071.0 | 0.8305 |\n| dataset_1 | 0.9 | 0.7427 | nan | 18984.0 | 21071.0 | 0.3583 |\n| dataset_2 | 0.7 | 0.4583 | nan | 13066.0 | 22046.0 | 0.8633 |\n| dataset_2 | 0.8 | 0.7183 | 0.0 | 15353.0 | 22046.0 | 0.8253 |\n| dataset_2 | 0.9 | 0.7667 | nan | 15196.0 | 22046.0 | 0.8117 |"}], "hidden": "C"}, {"order": 2, "question_id": "Q17", "question": "Is credit scoring by software regulated in the EU, and under what category?", "applicant": "P3", "category": "regulation", "facts": [["Geschaetztes Maximum", "KEINES gefunden"], ["Fall markiert", "nein"], ["Erwartete Quelle", "eu_ai_act"]], "answer": "The credit scoring process, including the use of software for credit assessments, is regulated in the European Union (EU) under the General Data Protection Regulation (GDPR) [2] and the Credit Agreements and Consumer Credit Directive (2008/48/EC) [2]. These regulations ensure that credit scoring models must be transparent, fair, and comply with data protection standards. However, specific categorization of credit scoring by software may fall under the broader categories of data protection and consumer credit regulations. [2]", "passages": [{"marker": 1, "source": "eba_guidelines p. 31-32", "score": 0.5882, "text": "tests on the aggregate credit portfolio as well as on relevant sub- portfolios and geographical segments; k. monitoring individual exposures through regular credit reviews, in accordance with the requirements set out in Section 8, including sample reviews of credit lines;\n\nl. ensuring the integrity and reliability of the internal ratings assignment process, as described in Article 173 of Regulation (EU) No 575/2013, where relevant for institutions with permission to use an i nternal ratings-based approach, and the integrity and reliability of the rating scale and ratings assignment process used by the institution, for the institutions using the standardised approach;\n\nm. performing quality assurance of credit assessments, taking into account an appropriate sample size, and ensuring that credit risk is properly identified, measured, monitored\n\n26 EBA/GL/2018/06.\n\n27 EBA/GL/2015/12.\n\nand managed within the institution’s business origination activities, and that regular reporting is communicated to the institution’s management body."}, {"marker": 2, "source": "eba_guidelines p. 6-7", "score": 0.5782, "text": "data for the purposes of such creditworthiness assessments. These guidelines also further specify the creditworthiness assessment of consumers laid down in Articles 18 and 20 of Directive 2014/17/EU (MCD) 7 and Article 8 of Directive 2008/48/EC on consumer credits (CCD)8.\n\n4. The objective of the guidelines is to improve institutions’ practices and associated governance arrangements, processes and mechanisms in relation to credit granting, in order to ensure that institutions have robust and prudent approaches to credit risk taking, management and\n\n1 The Council of the EU’s Action Plan to tackle non-performing loans in Europe (https://www.consilium.europa.eu/en/press/press-releases/2017/07/11/conclusions-non- performing-loans/). 2 EBA/GL/2018/06.\n\n3 EBA/GL/2018/10.\n\n4 https://eba.europa.eu/risk-analysis-and-data/eba-work- on-npls\n\n5 OJ L 176, 27.6.2013 p. 338- 436.\n\n6 EBA/GL/2017/11.\n\n7 OJ L 60, 28.2.2014 p. 34- 85.\n\n8 OJ L 133, 22.5.2008 p. 66- 92.\n\nmonitoring, and that newly originated loans are of high credit quality, while respecting and protecting the interests of consumers. By achieving these objectives, the EBA aims to improve the financial stability and resilience of the EU financial system."}, {"marker": 3, "source": "eba_guidelines p. 4", "score": 0.572, "text": "further specified in the EBA Guidelines on i nternal governance, and requirements on credit and counterparty risk, as laid down in Article 79 of Directive 2013/36/EU in relation to the granting and monitoring of credit facilities throughout their life cycle.\n\nThe guidelines introduce requirements for assessing the borrowers’ creditworthiness, together with the handling of information and data for the purposes of such assessments. These guidelines also further specify how to assess the creditworthiness of consumers and use consumer information laid down in Articles 18 and 20 of Directive 2014/17/EU (Mortgage Credit Directive, MCD). Furthermore, the guidelines also recognise the extension of the EBA’s scope of action in the review of the European Supervisory Authorities’ (ESAs’) Founding Regulations and incorporate guidance for the creditworthiness assessment in relation to consumer credit, in accordance with Article 8 of Directive 2008/48/EC on consumer credits (Consumer Credit Directive, CCD).\n\nTo support the dual focus of the guidelines, bringing together the prudential framework and consumer protection aspects of credit granting, the guidelines, in particular:"}, {"marker": 4, "source": "eba_guidelines p. 71", "score": 0.569, "text": "riskiness of the finance, etc.) 4. Minimum requirements for the certificates needed (classification, pollution, safety, etc.) 5. Minimum requirements for acceptable registries/‘flags ’ 6. Minimum requirements for acceptable classification societies Annex 2 — Information and data for the creditworthiness assessment\n\nThis annex provides a set of information, data items and evidence to be considered by institutions and creditors when collecting information for the purposes of creditworthiness assessment, in accordance with these guidelines. When relevant and more appropriate, e.g. when using automated models in credit granting, institutions and creditors may use other types/sources of information and data of an economic or financial nature that are necessary for the assessment, in compliance with the applicable legislation and in particular Directive 2008/48/EC, Directive 2014/17/EU and Regulation (EU) 2016/679.\n\nA. Lending to consumers"}], "hidden": "B"}, {"order": 3, "question_id": "Q02", "question": "What is the largest loan amount I could get?", "applicant": "P2", "category": "maximum", "facts": [["Geschaetztes Maximum", "KEINES gefunden"], ["Fall markiert", "JA - die Antwort muss menschliche Pruefung nennen"]], "answer": "Based on the information provided in your contract, the largest loan amount you could potentially get, according to past decisions in the data, is $20,000. This figure is derived from the specific details of your application, including your age, income, credit score, and employment status. However, it's important to note that this is an estimate from historical data and not a guarantee. The actual maximum loan amount could be higher, but the data used to make this estimate does not provide that information [2].\n\nAdditionally, since the maximum loan amount is marked as an upper limit in your contract, the real maximum could be greater, but the data cannot show this [2]. If the case is flagged, a human reviewer will need to make a final decision [3].", "passages": [{"marker": 1, "source": "feature_glossary", "score": 0.5518, "text": "Values the system calculates\n\n- **Loan-to-income:** the loan amount divided by the annual income. 0.3 means the loan\n  equals 30 % of one year's income. Higher values make approval less likely.\n- **P(approve):** the model's calibrated probability that a loan of this amount would be\n  approved for this applicant. 0.8 means: among applicants given 0.8, about 80 % were approved.\n- **Estimated maximum amount:** the highest loan amount for which P(approve) is still at\n  least 0.8. It is an estimate based on past decisions in the data, not a promise.\n- **Upper limit flag:** when the estimated maximum equals the highest amount the system was\n  allowed to check, the real maximum may be higher; the data does not show it.\n- **No amount found:** even the smallest amount checked does not reach P(approve) 0.8."}, {"marker": 2, "source": "fairness_report", "score": 0.5266, "text": "| 42093.0 | 560.0 | | dataset_2 | 31-45 | 1397 | 0.278 | 15182.0 | 48642.0 | 575.0 | | dataset_2 | 46-60 | 808 | 0.379 | 16448.0 | 54330.0 | 596.0 | | dataset_2 | 61+ |\n\n120 | 0.408 | 16840.0 | 60624.0 | 616.0 |\n\n*Adjusted rates*"}, {"marker": 3, "source": "model_card", "score": 0.5147, "text": "Model details\n\n- **Final models:** model A (dataset 1) and model B (dataset 2), each a Random Forest classifier.\n- **Monotonic constraint:** loan_amount and loan_to_income may only lower the approval probability, so the maximum-amount sweep is valid (checked in step 20).\n- **Calibration:** a correction learned on the validation part, so probabilities can be taken literally (step 19).\n- **Output:** P(approve) at the requested amount, and the highest amount with P(approve) >= 0.8 (also 0.7 and 0.9).\n- **Inputs:** age, dependents, annual income, credit score, loan amount, loan term, loan-to-income, marital status, education, employment status, loan purpose."}, {"marker": 4, "source": "fairness_report", "score": 0.4936, "text": "3. Maximum loan amount by age group\n\nThis section checks which age groups receive an estimated maximum loan amount (approval probability at least 0.8), and whether income or credit score explain the differences. 'Adjusted' rates assume every age group had the same mix of incomes and credit scores.\n\n**Key findings:**\n\n- Model A (dataset 1): the gap between age groups in getting an amount is 0.834; with the same income mix it is 0.761, with the same income and credit score mix 0.715. The gap is NOT explained by income or credit score (at most 14.3 % of it).\n- Model B (dataset 2): the gap between age groups in getting an amount is 0.257; with the same income mix it is 0.099, with the same income and credit score mix 0.129. The gap is mostly explained by income (about 61.5 % of it).\n\n*Per age group*"}], "hidden": "A"}, {"order": 4, "question_id": "Q21", "question": "My income is low relative to the amount I asked for. What do the rules say a lender should do in that situation?", "applicant": "P3", "category": "creditworthiness", "facts": [["Geschaetztes Maximum", "KEINES gefunden"], ["Fall markiert", "nein"], ["Erwartete Quelle", "eba_guidelines"]], "answer": "The rules state that lenders must consider the borrower's income, employment status, and other factors to determine the maximum loan amount. In your case, with an annual income of $29,000, the lender will likely assess whether this income is sufficient to cover the monthly payments on a $30,000 loan over 84 months [2]. Given your low income, the lender may require a lower loan amount to ensure that the monthly payments are manageable. [2]", "passages": [{"marker": 1, "source": "eba_guidelines p. 36", "score": 0.5144, "text": "past the borrower ’s expected retirement age, institutions and creditors should take appropriate account of the adequacy of the borrower ’s likely source of repayment capacity and ability to continue to meet obligations under the loan agreement in retirement. 105.\n\nInstitutions and creditors should ensure that the borrower’s ability to meet obligations under the loan agreement is not based on an expected significant increase in the borrower ’s income, unless the documentation provides sufficient evidence. 106. When assessing the borrower ’s ability to meet obligations under the loan agreement, institutions and creditors should account for committed and other non-discretionary expenditures, such as the borrower’ s current obligations, including appropriate substantiation and consideration of living expenses. 107. As part of the creditworthiness assessment, institutions and creditors should carry out sensitivity analyses reflecting potential negative events in the future, including a reduction in income; an increase in interest rates in cases of variable rate loan agreements; negative amortisation of the loan; and balloon payments or deferred payments of the principal or interest. 108."}, {"marker": 2, "source": "eba_guidelines p. 37", "score": 0.4971, "text": "5.2.4 Unsecured lending to consumers\n\n114. This section further specifies the requirements to assess the creditworthiness of the borrower referred to in Article 8 of Directive 2008/48/EC. In relation to loan agreements subject to national laws transposing that Directive institutions and creditors should apply, in addition to provisions set out in Section 5.2.1, provisions set out in this section. 115. Where necessary, in particular in cases of borrowers who are self- employed or have seasonal or other irregular income, institutions and creditors should make reasonable enquiries and take reasonable steps to assess and verify the source of repayment capacity. 116. Institutions and creditors should ensure that the borrower’s ability to meet obligations under the loan agreement is not based on an expected significant increase in the borrower ’s income, unless the documentation provides sufficient evidence. 117.\n\nAs part of the creditworthiness assessment, institutions and creditors, if applicable, should carry out sensitivity analyses to reflect potential negative events specific to the type of loan"}, {"marker": 3, "source": "eba_guidelines p. 38", "score": 0.4907, "text": "of structural subordination and related terms, e.g. covenants, and, if applicable, third-party guarantees and collateral structure. 122. Institutions should carry out the creditworthiness assessment in relation to the specificities of the loan, such as nature, maturity and interest rate. 123.\n\nFor assessing the borrower’s ability to meet obligations under the loan agreement, institutions should adopt suitable methods and approaches, which may include models, as long as these guidelines are met. The selection of the suitable and adequate method should depend on the risk level, size and type of loan."}, {"marker": 4, "source": "eba_guidelines p. 85", "score": 0.485, "text": "activity, should focus more on protecting consumer interests, including assessing the suitability of products, protecting consumers from loan sharks and mitigating negative consequences of default. The BSG suggested that the EBA emphasise, in the guidelines, the concept of responsible lending.\n\nFurthermore, the BSG made a series of suggestions to improve the consumer protection dimension of the guidelines. The suggestions aim to ensure that the institutions’ credit policies and procedures and the creditworthiness assessment do not lead to discrimination against borrowers and appropriately take into account borrowers’ characteristics (e.g. life expenditure, household composition), to ensure that the products are suitable for the borrowers and that loan servicing does not induce any undue hardship on the borrowers.\n\nWith respect to creditworthiness assessment, the BSG also suggested that there needs to be a clarification in the credit decision-making process between acceptance and refusal thresholds linked to default rates."}], "hidden": "A"}, {"order": 5, "question_id": "Q10", "question": "What is this model intended to be used for, and what is it not suitable for?", "applicant": "P4", "category": "metrics", "facts": [["Geschaetztes Maximum", "41.579"], ["Fall markiert", "nein"], ["Erwartete Quelle", "model_card"]], "answer": "The model is intended to estimate the largest loan amount an applicant would likely be approved for, based on the information provided. It is not suitable for making definitive decisions on loan approval; instead, it provides an estimate based on historical data and is designed to support a human reviewer in the decision-making process [1].", "passages": [{"marker": 1, "source": "model_card", "score": 0.263, "text": "Intended use\n\nTODO (academic proof of concept: estimate the largest loan amount an applicant\nwould likely be approved for, and explain it; supports a human, never decides alone)"}, {"marker": 2, "source": "model_card", "score": 0.2473, "text": "Caveats\n\nTODO (synthetic data; dataset 1's maximum often equals the upper sweep limit;\nthe EBM was as accurate as the Random Forest on the test part)"}, {"marker": 3, "source": "eba_guidelines p. 25", "score": 0.2334, "text": "that the models are fit for purpose, taking into account the identified task and other criteria, such as its performance and use. If explanations are required during the models’ use, then consideration should be given to developing an interpretable model.\n\ne. Understand the quality of data and inputs to the model and detect and prevent bias in the credit decision-making process, ensuring that appropriate safeguards are in place to provide confidentiality, integrity and availability of information and systems.\n\nf. Ensure the performance of the model, including the validity and quality of its outputs, is continuously monitored and appropriate remediation measures are taken in a timely manner in the case of detected issues (e.g. worsening or deviating from expected behaviour)."}, {"marker": 4, "source": "eba_guidelines p. 25", "score": 0.2234, "text": "4.3.3 Technology-enabled innovation for credit granting\n\n53. When using technology-enabled innovation for credit-granting purposes, institutions should do the following:\n\na. Adequately capture, in their risk management and control frameworks, the inherent risks associated with the technology-enabled innovation in use. This should be commensurate with the business model, credit risk exposure, complexity of the methods and the extent of the use of technology-enabled innovation.\n\nb. Ensure that t he management body has a sufficient understanding of the use of technology-enabled innovation, its limitation and the impact it has on credit-granting procedures.\n\nc. Understand the underlying models used, including their capabilities, assumptions and limitations, along with ensuring their traceability, auditability, and robustness and resilience.\n\nd. Ensure that the models are fit for purpose, taking into account the identified task and other criteria, such as its performance and use. If explanations are required during the models’ use, then consideration should be given to developing an interpretable model."}], "hidden": "C"}, {"order": 6, "question_id": "Q10", "question": "What is this model intended to be used for, and what is it not suitable for?", "applicant": "P4", "category": "metrics", "facts": [["Geschaetztes Maximum", "41.579"], ["Fall markiert", "nein"], ["Erwartete Quelle", "model_card"]], "answer": "The model is intended to estimate the largest loan amount an applicant might be approved for based on the information provided. It is not suitable for providing a definitive approval or guarantee of a loan. The model uses historical data to make an educated guess, but it cannot account for every possible factor that a lender might consider during the actual loan approval process. [2]", "passages": [{"marker": 1, "source": "model_card", "score": 0.26 a necessary for the assessment, in compliance with applicable legislation [4]. \n\nTherefore, credit scoring by software falls under the broader category of credit risk management and consumer protection in the EU, with specific requirements outlined in the relevant regulations and guidelines. [2]", "passages": [{"marker": 1, "source": "eba_guidelines p. 31-32", "score": 0.5882, "text": "tests on the aggregate credit portfolio as well as on relevant sub- portfolios and geographical segments; k. monitoring individual exposures through regular credit reviews, in accordance with the requirements set out in Section 8, including sample reviews of credit lines;\n\nl. ensuring the integrity and reliability of the internal ratings assignment process, as described in Article 173 of Regulation (EU) No 575/2013, where relevant for institutions with permission to use an i nternal ratings-based approach, and the integrity and reliability of the rating scale and ratings assignment process used by the institution, for the institutions using the standardised approach;\n\nm. performing quality assurance of credit assessments, taking into account an appropriate sample size, and ensuring that credit risk is properly identified, measured, monitored\n\n26 EBA/GL/2018/06.\n\n27 EBA/GL/2015/12.\n\nand managed within the institution’s business origination activities, and that regular reporting is communicated to the institution’s management body."}, {"marker": 2, "source": "eba_guidelines p. 6-7", "score": 0.5782, "text": "data for the purposes of such creditworthiness assessments. These guidelines also further specify the creditworthiness assessment of consumers laid down in Articles 18 and 20 of Directive 2014/17/EU (MCD) 7 and Article 8 of Directive 2008/48/EC on consumer credits (CCD)8.\n\n4. The objective of the guidelines is to improve institutions’ practices and associated governance arrangements, processes and mechanisms in relation to credit granting, in order to ensure that insti const W = DATA.words;
// One store for both languages, so switching keeps what is already entered.
const KEY = "rubrik-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { state = {}; }

document.getElementById("heading").textContent = W.heading;
document.getElementById("nameLabel").textContent = W.name;
document.getElementById("rater").placeholder = W.name_hint;
document.getElementById("save").textContent = W.download;
document.getElementById("clear").textContent = W.clear;
const switcher = document.getElementById("switch");
switcher.textContent = W.other_language;
switcher.href = W.other_file;

const esc = s => String(s).replace(/[&<>]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const cards = document.getElementById("cards");
DATA.rows.forEach(row => {
  const card = document.createElement("div");
  card.className = "card";
  card.id = "card-" + row.order;

  let facts = row.facts.map(([k, v]) => {
    const warn = v === DATA.flaggedYes ? ' class="flag"' : "";
    return `<div><b>${k}</b><span${warn}>${v}</span></div>`;
  }).join("");

  let dims = DATA.dimensions.map(d => {
    const opts = d.options.map((text, value) =>
      `<label><input type="radio" name="${d.key}-${row.order}" value="${value}">${text}</label>`
    ).join("");
    return `<div class="dim"><b>${d.label}</b>${opts}</div>`;
  }).join("");

  card.innerHTML = `
    <div><span class="num">${row.order} ${W.of} ${DATA.rows.length}</span>
         <span class="sub"> &middot; ${row.question_id} &middot; ${row.category}
         &middot; ${W.applicant} ${row.applicant}</span></div>
    <div class="q">${row.question}</div>
    <div class="facts">${facts}</div>
    <div class="answer">${esc(row.answer)}</div>
    <details><summary>${W.passages}</summary>
      <div class="pnote">${W.passages_note}</div>
      ${row.passages.map(p => `<div class="passage">
         <span class="mk">[${p.marker}]</span>
         <span class="src">${esc(p.source)} &middot; ${p.score}</span>
         <p>${esc(p.text)}</p></div>`).join("")}
    </details>
    ${dims}
    <div class="dim"><b>${W.note}</b>
      <textarea rows="2" id="note-${row.order}"></textarea></div>`;
  cards.appendChild(card);
});

function restore() {
  DATA.rows.forEach(row => {
    const saved = state[row.order] || {};
    DATA.dimensions.forEach(d => {
      if (saved[d.key] !== undefined) {
        const el = document.querySelector(`input[name="${d.key}-${row.order}"][value="${saved[d.key]}"]`);
        if (el) el.checked = true;
      }
    });
    if (saved.note) document.getElementById("note-" + row.order).value = saved.note;
  });
  if (state.__rater) document.getElementById("rater").value = state.__rater;
}

function collect() {
  const out = [];
  DATA.rows.forEach(row => {
    const entry = { note: document.getElementById("note-" + row.order).value };
    DATA.dimensions.forEach(d => {
      const picked = document.querySelector(`input[name="${d.key}-${row.order}"]:checked`);
      if (picked) entry[d.key] = Number(picked.value);
    });
    out.push({ row, entry });
  });
  return out;
}

function refresh() {
  const all = collect();
  let complete = 0;
  all.forEach(({ row, entry }) => {
    const done = DATA.dimensions.every(d => entry[d.key] !== undefined);
    if (done) complete++;
    document.getElementById("card-" + row.order).classList.toggle("done", done);
    state[row.order] = entry;
  });
  state.__rater = document.getElementById("rater").value;
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}

  const total = DATA.rows.length;
  document.getElementById("status").textContent =
    complete + " " + W.of + " " + total + " " + W.rated;
  document.getElementById("bar").style.width = (100 * complete / total) + "%";
  document.getElementById("save").disabled = complete === 0;
  document.getElementById("hint").textContent =
    complete < total ? W.partial : W.complete;
}

document.addEventListener("input", refresh);
document.addEventListener("change", refresh);

document.getElementById("clear").onclick = () => {
  if (!confirm(W.confirm)) return;
  localStorage.removeItem(KEY);
  location.reload();
};

document.getElementById("save").onclick = () => {
  const rater = document.getElementById("rater").value || "";
  const cols = ["rating_order", "question_id", "category"]
    .concat(DATA.dimensions.map(d => d.key))
    .concat(["rater", "note", "configuration_hidden"]);
  const esc = v => {
    const s = v === undefined || v === null ? "" : String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [cols.join(",")];
  collect().forEach(({ row, entry }) => {
    const values = [row.order, row.question_id, row.category]
      .concat(DATA.dimensions.map(d => entry[d.key] === undefined ? "" : entry[d.key]))
      .concat([rater, entry.note, row.hidden]);
    lines.push(values.map(esc).join(","));
  });
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], {type: "text/csv;charset=utf-8"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "evaluation_rubric_filled.csv";
  link.click();
};

restore();
refresh();
</script>
</body>
</html>
